services:
  kugou-api:
    build: ./repo_kugou_api
    environment:
      platform: lite
      PORT: "3000"
      HOST: "0.0.0.0"
      KUGOU_API_GUID: ${KUGOU_API_GUID:?Set a stable device GUID in .env}
      KUGOU_API_DEV: ${KUGOU_API_DEV:?Set a stable 10-character device ID in .env}
      KUGOU_API_MAC: "02:00:00:00:00:00"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
